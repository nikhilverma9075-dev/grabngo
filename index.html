<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrabNGo – Packed before you arrive</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      background: #0c831f;
      color: white;
      padding: 20px;
      width: 100%;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
    .tagline {
      margin: 10px 0 20px 0;
      color: #333;
      font-size: 16px;
      text-align: center;
    }
    .card {
      background: white;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    button {
      background: #0c831f;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    input {
      width: 80%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>GrabNGo</header>
<div class="tagline">Packed before you arrive</div>

<div class="card">
  <h3>Create Account as Shopkeeper</h3>
  <input type="text" id="shopName" placeholder="Shop Name">
  <input type="text" id="shopAddress" placeholder="Address">
  <input type="text" id="shopMobile" placeholder="Mobile Number">
  <button onclick="shopkeeperLogin()">Enter as Shopkeeper</button>
</div>

<div class="card">
  <h3>Create Account as Customer</h3>
  <input type="text" id="custName" placeholder="Your Name">
  <input type="text" id="custAddress" placeholder="Address">
  <input type="text" id="custMobile" placeholder="Mobile Number">
  <button onclick="customerLogin()">Enter as Customer</button>
</div>

<script>
function shopkeeperLogin() {
  const name = document.getElementById('shopName').value;
  const address = document.getElementById('shopAddress').value;
  const mobile = document.getElementById('shopMobile').value;
  if(name && address && mobile) {
    localStorage.setItem('userType', 'shopkeeper');
    localStorage.setItem('userName', name);
    localStorage.setItem('userAddress', address);
    localStorage.setItem('userMobile', mobile);
    window.location.href = 'shopkeeper-dashboard.html';
  } else {
    alert('Please fill all fields!');
  }
}

function customerLogin() {
  const name = document.getElementById('custName').value;
  const address = document.getElementById('custAddress').value;
  const mobile = document.getElementById('custMobile').value;
  if(name && address && mobile) {
    localStorage.setItem('userType', 'customer');
    localStorage.setItem('userName', name);
    localStorage.setItem('userAddress', address);
    localStorage.setItem('userMobile', mobile);
    window.location.href = 'customer-home.html';
  } else {
    alert('Please fill all fields!');
  }
}
</script>

</body>
</html>

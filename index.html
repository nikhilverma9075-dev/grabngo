<!DOCTYPE html>
<html>
<head>
  <title>GrabNGo – Packed before you arrive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
    }
    header {
      background: #0c831f;
      color: white;
      padding: 16px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }
    .container {
      padding: 16px;
    }
    .card {
      background: white;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    button {
      background: #0c831f;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>GrabNGo</header>

<div class="container">
  <div class="card">
    <h3>Nearby Kirana Store</h3>
    <p>Distance: 120 meters</p>
    <button>Add Items</button>
  </div>

  <div class="card">
    <h3>Select Pickup Time</h3>
    <p>Example: 5:00 PM</p>
    <button>Confirm Slot</button>
  </div>

  <div class="card">
    <h3>No Login. No OTP.</h3>
    <p>Just enter your name and book.</p>
  </div>
</div>

</body>
</html>

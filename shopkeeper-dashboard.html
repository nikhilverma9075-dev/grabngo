  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopkeeper Dashboard – GrabNGo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f7f7f7;
    }
    header {
      background: #0c831f;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }
    .container {
      max-width: 900px;
      margin: auto;
      padding: 16px;
    }
    h2 {
      text-align: center;
      color: #0c831f;
    }
    .add-item {
      background: white;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 16px;
    }
    input {
      width: calc(50% - 12px);
      padding: 8px;
      margin: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      background: #0c831f;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      margin: 6px;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .card {
      background: white;
      width: 140px;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .card img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .card h4 {
      margin: 4px 0;
      font-size: 14px;
    }
    .card p {
      margin: 2px 0;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>

<header>Shopkeeper Dashboard – GrabNGo</header>

<div class="container">
  <h2>Welcome, <span id="shopNameDisplay"></span></h2>

  <div class="add-item">
    <h3>Add Item</h3>
    <input type="text" id="itemName" placeholder="Item Name">
    <input type="number" id="itemPrice" placeholder="Price (₹)">
    <input type="number" id="itemQty" placeholder="Quantity">
    <input type="text" id="itemPhoto" placeholder="Photo URL (optional)">
    <br>
    <button onclick="addItem()">Add Item</button>
  </div>

  <h3>Your Items</h3>
  <div class="grid" id="itemGrid">
    <!-- Items will appear here -->
  </div>
</div>

<script>
document.getElementById('shopNameDisplay').innerText = localStorage.getItem('userName') || "Shopkeeper";

let items = [];

function addItem() {
  const name = document.getElementById('itemName').value.trim();
  const price = document.getElementById('itemPrice').value.trim();
  const qty = document.getElementById('itemQty').value.trim();
  const photo = document.getElementById('itemPhoto').value.trim();

  if(!name || !price || !qty){
    alert('Please fill Name, Price and Quantity!');
    return;
  }

  const item = { name, price, qty, photo };
  items.push(item);
  updateGrid();

  // Clear inputs
  document.getElementById('itemName').value = '';
  document.getElementById('itemPrice').value = '';
  document.getElementById('itemQty').value = '';
  document.getElementById('itemPhoto').value = '';
}

function updateGrid(){
  const grid = document.getElementById('itemGrid');
  grid.innerHTML = '';
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      ${item.photo ? `<img src="${item.photo}" alt="${item.name}">` : '<div style="height:100px; line-height:100px; color:#aaa; background:#f0f0f0; border-radius:6px;">No Image</div>'}
      <h4>${item.name}</h4>
      <p>₹${item.price}</p>
      <p>Qty: ${item.qty}</p>
    `;
    grid.appendChild(div);
  });
}
</script>

</body>
</html>

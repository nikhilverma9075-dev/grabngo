<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopkeeper Dashboard – GrabNGo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f7f7f7;
    }
    header {
      background: #0c831f;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }
    .container {
      padding: 16px;
      max-width: 600px;
      margin: auto;
    }
    h2 {
      text-align: center;
      color: #0c831f;
    }
    .category {
      background: white;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    input {
      width: 80%;
      padding: 8px;
      margin: 6px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      background: #0c831f;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }
    ul {
      list-style-type: none;
      padding-left: 0;
    }
    li {
      padding: 6px 0;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>
<body>

<header>Shopkeeper Dashboard – GrabNGo</header>

<div class="container">
  <h2>Welcome, <span id="shopNameDisplay"></span></h2>

  <div class="category">
    <h3>Add Item</h3>
    <input type="text" id="itemName" placeholder="Item Name">
    <input type="number" id="itemPrice" placeholder="Price (₹)">
    <input type="number" id="itemQty" placeholder="Quantity">
    <button onclick="addItem()">Add Item</button>
    <h4>Items Added:</h4>
    <ul id="itemList"></ul>
  </div>
</div>

<script>
// Display shopkeeper name from localStorage
document.getElementById('shopNameDisplay').innerText = localStorage.getItem('userName') || "Shopkeeper";

// Temporary items array
let items = [];

// Add item function
function addItem() {
  const name = document.getElementById('itemName').value;
  const price = document.getElementById('itemPrice').value;
  const qty = document.getElementById('itemQty').value;

  if(name && price && qty) {
    const item = {name, price, qty};
    items.push(item);
    updateItemList();
    // Clear inputs
    document.getElementById('itemName').value = '';
    document.getElementById('itemPrice').value = '';
    document.getElementById('itemQty').value = '';
  } else {
    alert('Please fill all fields!');
  }
}

// Update the item list on the page
function updateItemList() {
  const ul = document.getElementById('itemList');
  ul.innerHTML = '';
  items.forEach((item, index) => {
    const li = document.createElement('li');
    li.textContent = `${item.name} – ₹${item.price} – Qty: ${item.qty}

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrabNGo – Customer Demo</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f7f7f7;
  }
  header {
    background: #0c831f;
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
  }
  .container {
    max-width: 700px;
    margin: auto;
    padding: 16px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* 3 horizontal */
    grid-gap: 12px;
    margin-top: 16px;
  }
  .card {
    background: white;
    border-radius: 8px;
    padding: 8px;
    text-align: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  .card img {
    width: 100%;
    height: 80px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 6px;
  }
  .card h4 {
    margin: 4px 0;
    font-size: 14px;
  }
  .card p {
    margin: 2px 0;
    font-size: 12px;
    color: #555;
  }
  .card button {
    background: #0c831f;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    margin-top: 4px;
  }
  .quantity-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 4px;
    gap: 6px;
  }
  .quantity-controls button {
    width: 24px;
    height: 24px;
    padding: 0;
  }
  .cart {
    background: #fff;
    padding: 12px;
    margin-top: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  .cart h3 {
    margin: 0 0 8px 0;
  }
  .cart-item {
    font-size: 14px;
    margin-bottom: 4px;
  }
  .pickup {
    margin-top: 12px;
  }
</style>
</head>
<body>

<header>GrabNGo – Customer Demo</header>

<div class="container">
  <h2>Nearby Shop – Demo Shop</h2>

  <div class="grid" id="itemGrid">
    <!-- 6 preloaded items will appear here -->
  </div>

  <div class="cart">
    <h3>Your Cart</h3>
    <div id="cartItems">
      <p>No items added yet.</p>
    </div>
    <div class="pickup">
      <label for="pickupTime">Select Pickup Time:</label>
      <input type="time" id="pickupTime">
      <button onclick="confirmOrder()">Confirm Order</button>
    </div>
  </div>
</div>

<script>
// 6 preloaded demo items
let items = [
  { name: "Chini 1kg", price: 40, qty: 10, photo: "https://i.imgur.com/0Z8j3Rk.jpg", selectedQty: 0 },
  { name: "Aata 5kg", price: 250, qty: 20, photo: "https://i.imgur.com/7b3h2gU.jpg", selectedQty: 0 },
  { name: "Oil 1L", price: 120, qty: 15, photo: "https://i.imgur.com/Y3xK7T0.jpg", selectedQty: 0 },
  { name: "Salt 1kg", price: 30, qty: 25, photo: "https://i.imgur.com/N6UfZpT.jpg", selectedQty: 0 },
  { name: "Sugar 2kg", price: 75, qty: 18, photo: "https://i.imgur.com/kYjV6Ew.jpg", selectedQty: 0 },
  { name: "Tea 500g", price: 90, qty: 12, photo: "https://i.imgur.com/5ZsQzU0.jpg", selectedQty: 0 }
];

let cart = [];

function updateGrid() {
  const grid = document.getElementById('itemGrid');
  grid.innerHTML = '';
  items.forEach((item, index) => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <img src="${item.photo}" alt="${item.name}">
      <h4>${item.name}</h4>
      <p>₹${item.price}</p>
      <p>Available: ${item.qty}</p>
      <div class="quantity-controls">
        <button onclick="decreaseQty(${index})">-</button>
        <span id="qty${index}">${item.selectedQty}</span>
        <button onclick="increaseQty(${index})">+</button>
      </div>
      <button onclick="addToCart(${index})">Add to Cart</button>
    `;
    grid.appendChild(div);
  });
}

function increaseQty(index){
  if(items[index].selectedQty < items[index].qty){
    items[index].selectedQty++;
    document.getElementById(`qty${index}`).innerText = items[index].selectedQty;
  }
}

function decreaseQty(index){
  if(items[index].selectedQty > 0){
    items[index].selectedQty--;
    document.getElementById(`qty${index}`).innerText = items[index].selectedQty;
  }
}

function addToCart(index){
  if(items[index].selectedQty === 0){
    alert('Select quantity first!');
    return;
  }
  const item = {...items[index]};
  cart.push(item);
  items[index].selectedQty = 0;
  updateGrid();
  updateCart();
}

function updateCart(){
  const cartDiv = document.getElementById('cartItems');
  cartDiv.innerHTML = '';
  if(cart.length === 0){
    cartDiv.innerHTML = '<p>No items added yet.</p>';
  } else {
    cart.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'cart-item';
      div.innerText = `${item.name} – ₹${item.price} – Qty: ${item.selectedQty}`;
      cartDiv.appendChild(div);
    });
  }
}

function confirmOrder(){
  const pickup = document.getElementById('pickupTime').value;
  if(cart.length === 0){
    alert('Please add items to cart first!');
    return;
  }
  if(!pickup){
    alert('Please select pickup time!');
    return;
  }
  alert(`Order confirmed! Pickup at ${pickup}.`);
  cart = [];
  updateCart();
}

updateGrid();
</script>

</body>
</html>
